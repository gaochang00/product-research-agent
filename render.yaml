# 产品调研智能体 (Product Research Agent) - Render 云部署配置（Python 运行时）
# 使用方法：
# 1. 将整个 gc01 目录推送到 GitHub 仓库
# 2. 在 Render (https://render.com) 中：New -> Blueprint -> 连接 GitHub 仓库
# 3. Render 会自动读取本文件并部署服务
#
# 注意：
# - 请勿将 backend/.env 提交到 Git（.env 中的代理地址仅用于本地调试）
# - 云端抓取 Amazon 走数据中心 IP，无需本地代理；
#   若云端被 Amazon 限流/验证码拦截，可在 Render 环境变量中配置
#   RAINFOREST_API_KEY 作为兜底数据源（category_data.py 会自动降级）

services:
  - type: web
    name: product-research-agent
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt --no-cache-dir
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0
      # 可选：配置 Rainforest API Key 作为云端抓取兜底
      # - key: RAINFOREST_API_KEY
      #   value: 你的Key
